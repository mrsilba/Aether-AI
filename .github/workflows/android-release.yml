name: Aether AI — Android Build, Test & Release Pipeline

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'
      - 'master'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        type: choice
        options:
          - 'assembleRelease'
          - 'assembleDebug'
          - 'bundleRelease'
        default: 'assembleRelease'
      run_tests:
        description: 'Run Unit and Robolectric Tests'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-package:
    name: Build, Test & Package Aether AI
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ====================================================================
      # 1. ENVIRONMENT SETUP
      # ====================================================================
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages & Accept Licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses || true
          echo "Installing required Android SDK packages..."
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses || true
          if [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          echo "$ANDROID_HOME/build-tools/36.0.0" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_SDK_ROOT"
          test -x "$ANDROID_HOME/platform-tools/adb"
          sdkmanager --list_installed

      - name: Set up Gradle Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

      - name: Grant Execute Permissions to Gradle Wrapper
        run: |
          chmod +x gradlew
          ./gradlew --version

      # ====================================================================
      # 2. AUTOMATED TESTING
      # ====================================================================
      - name: Run Unit & Robolectric Tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          echo "Executing Aether AI automated test suite via Gradle Wrapper..."
          ./gradlew --no-daemon clean
          ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-ai-unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      # ====================================================================
      # 3. SIGNING CONFIGURATION USING REPOSITORY SECRETS
      # ====================================================================
      - name: Prepare Debug Keystore Fallback
        run: |
          echo "Verifying debug keystore availability..."
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Restoring debug.keystore from repository base64 template..."
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              echo "Generating standard debug keystore via keytool..."
              keytool -genkey -v -keystore debug.keystore \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          test -f "debug.keystore" && echo "Debug keystore ready."

      - name: Configure Release Signing Keystore from Secrets
        id: signing_setup
        run: |
          echo "Configuring release signing parameters..."
          TEMP_KEYSTORE_DIR="${{ runner.temp }}/keystore"
          mkdir -p "$TEMP_KEYSTORE_DIR"

          # Support ANDROID_KEYSTORE_BASE64, KEYSTORE_BASE64, and RELEASE_KEYSTORE_BASE64
          KEYSTORE_SECRET="${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}"
          STORE_PWD="${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}"
          KEY_PWD="${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}"
          KEY_ALIAS_NAME="${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || 'upload' }}"

          if [ -n "$KEYSTORE_SECRET" ] && [ -n "$STORE_PWD" ] && [ -n "$KEY_PWD" ]; then
            echo "Decoding release keystore from repository secrets..."
            echo "$KEYSTORE_SECRET" | base64 --decode > "$TEMP_KEYSTORE_DIR/release.jks"
            echo "KEYSTORE_PATH=$TEMP_KEYSTORE_DIR/release.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PWD" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PWD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS_NAME" >> $GITHUB_ENV
            echo "HAS_RELEASE_SIGNING=true" >> $GITHUB_ENV
            echo "Release keystore configured successfully."
          else
            echo "Release keystore secrets not configured (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD)."
            echo "HAS_RELEASE_SIGNING=false" >> $GITHUB_ENV
            echo "Will generate unsigned release APK or debug APK."
          fi

      # ====================================================================
      # 4. BUILD & PACKAGE INSTALLABLE APK
      # ====================================================================
      - name: Build Android Package
        run: |
          BUILD_TASK="${{ inputs.build_type || 'assembleRelease' }}"
          echo "Requested build task: $BUILD_TASK"

          if [ "$HAS_RELEASE_SIGNING" = "true" ]; then
            echo "Release signing credentials detected. Building certified release APK..."
            ./gradlew --no-daemon "$BUILD_TASK" --stacktrace
          else
            echo "No production release signing secrets configured."
            echo "Building installable debug APK so the resulting package can be installed directly on target devices without Android Package Manager rejection..."
            ./gradlew --no-daemon assembleDebug --stacktrace
          fi

      - name: Secure Cleanup of Sensitive Keystore Files
        if: always()
        run: |
          echo "Cleaning up any temporary release keystore files..."
          rm -rf "${{ runner.temp }}/keystore"

      # ====================================================================
      # 5. FORENSIC APK INTEGRITY, SIGNATURE & METADATA VALIDATION
      # ====================================================================
      - name: Forensic APK Integrity, Signature & Device Compatibility Validation
        id: validate_and_package
        run: |
          mkdir -p dist_artifacts

          # Collect generated APKs and AABs
          find app/build/outputs/ -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} dist_artifacts/ \;

          cd dist_artifacts
          echo "Collected artifact files:"
          ls -lh

          # Prefer signed release APK, then signed debug APK, rejecting any unsigned APK
          PRIMARY_APK=""
          for candidate in app-release.apk app-debug.apk; do
            if [ -f "$candidate" ]; then
              PRIMARY_APK="$candidate"
              break
            fi
          done

          if [ -z "$PRIMARY_APK" ]; then
            echo "FATAL: No suitable installable APK (app-release.apk or app-debug.apk) was produced!"
            exit 1
          fi

          echo "Target Primary APK for Validation: $PRIMARY_APK"

          # 1. Non-empty check
          if [ ! -s "$PRIMARY_APK" ]; then
            echo "FATAL: APK file $PRIMARY_APK is empty!"
            exit 1
          fi

          # 2. ZIP Archive Integrity Check
          echo "Validating ZIP container integrity..."
          unzip -t "$PRIMARY_APK" > /dev/null || {
            echo "FATAL: APK ZIP container corrupted!"
            exit 1
          }
          echo "ZIP container integrity: PASSED"

          # 3. AAPT2 Manifest & Device Compatibility Badging
          echo "Validating package metadata, SDK levels, and ABIs via aapt2..."
          aapt2 dump badging "$PRIMARY_APK" > aapt2_badging.txt
          cat aapt2_badging.txt | grep -E "package: name=|versionCode=|versionName=|minSdkVersion|targetSdkVersion|native-code"

          # Verify mandatory package name
          grep "name='com.aistudio.aetherai.kqwzrt'" aapt2_badging.txt || {
            echo "FATAL: Package name mismatch!"
            exit 1
          }

          # Verify ARM64-v8a compatibility
          grep "arm64-v8a" aapt2_badging.txt || {
            echo "FATAL: arm64-v8a architecture not supported!"
            exit 1
          }
          echo "Package metadata and ARM64-v8a compatibility: PASSED"

          # 4. APK Signature Validation with apksigner
          echo "Verifying APK signing certificate and schemes via apksigner..."
          apksigner verify --verbose --print-certs "$PRIMARY_APK" > apksigner_report.txt
          cat apksigner_report.txt

          grep "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner_report.txt || {
            echo "FATAL: APK is not signed with valid APK Signature Scheme v2!"
            exit 1
          }
          echo "APK signature verification: PASSED (Signature valid, installable on Android 14/15)"

          # 5. Remove any unsigned APKs from dist_artifacts to prevent user confusion
          rm -f app-release-unsigned.apk || true

          # 6. Calculate SHA-256 and MD5 for every verified artifact
          echo "Calculating cryptographic checksums..."
          for file in *; do
            if [ -f "$file" ] && [[ "$file" != *.sha256 && "$file" != *.md5 && "$file" != *.txt ]]; then
              sha256sum "$file" > "${file}.sha256"
              md5sum "$file" > "${file}.md5"
              echo "Checksum for $file:"
              cat "${file}.sha256"
            fi
          done

          # Consolidated SHA-256 manifest
          sha256sum *.{apk,aab} 2>/dev/null > CHECKSUMS_SHA256.txt || true
          cat CHECKSUMS_SHA256.txt
          cd ..

      # ====================================================================
      # 6. ARTIFACT UPLOADS
      # ====================================================================
      - name: Upload Verified Installable Build Artifacts & Checksums
        uses: actions/upload-artifact@v4
        with:
          name: aether-ai-verified-installable-apk
          path: |
            dist_artifacts/*.apk
            dist_artifacts/*.aab
            dist_artifacts/*.sha256
            dist_artifacts/*.md5
            dist_artifacts/CHECKSUMS_SHA256.txt
            dist_artifacts/apksigner_report.txt
            dist_artifacts/aapt2_badging.txt
          retention-days: 30
          if-no-files-found: error

      # ====================================================================
      # 7. AUTOMATED GITHUB RELEASE (TAGGED BUILDS ONLY)
      # ====================================================================
      - name: Publish Automated GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Aether AI ${{ github.ref_name }} — Production Release"
          body_path: RELEASE_V1.0.0.md
          files: |
            dist_artifacts/*.apk
            dist_artifacts/*.aab
            dist_artifacts/*.sha256
            dist_artifacts/*.md5
            dist_artifacts/CHECKSUMS_SHA256.txt
            dist_artifacts/apksigner_report.txt
            dist_artifacts/aapt2_badging.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
