name: Aether AI — Android Build, Test & Release Pipeline

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'
      - 'master'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        type: choice
        options:
          - 'assembleRelease'
          - 'assembleDebug'
          - 'bundleRelease'
        default: 'assembleRelease'
      run_tests:
        description: 'Run Unit and Robolectric Tests'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-package:
    name: Build, Test & Package Aether AI
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ====================================================================
      # 1. ENVIRONMENT SETUP
      # ====================================================================
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses || true
          echo "Installing exact Android SDK packages without deprecated tools..."
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"
          yes | sdkmanager --licenses || true

      - name: Verify Android SDK
        run: |
          echo "=== Android SDK Diagnostic Verification ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed
          adb version
          java -version

      - name: Set up Gradle Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

      - name: Grant Execute Permissions to Gradle Wrapper
        run: chmod +x gradlew || true

      # ====================================================================
      # 2. AUTOMATED TESTING
      # ====================================================================
      - name: Run Unit & Robolectric Tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          echo "Executing Aether AI automated test suite..."
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace || gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-ai-unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      # ====================================================================
      # 3. SIGNING CONFIGURATION USING REPOSITORY SECRETS
      # ====================================================================
      - name: Configure Release Signing Keystore from Secrets
        id: signing_setup
        run: |
          echo "Configuring release signing parameters..."
          mkdir -p "${{ github.workspace }}/keystore"

          # Support both KEYSTORE_BASE64 and RELEASE_KEYSTORE_BASE64 secret naming
          KEYSTORE_SECRET="${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}"
          STORE_PWD="${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}"
          KEY_PWD="${{ secrets.KEY_PASSWORD }}"
          KEY_ALIAS_NAME="${{ secrets.KEY_ALIAS || 'upload' }}"

          if [ -n "$KEYSTORE_SECRET" ] && [ -n "$STORE_PWD" ] && [ -n "$KEY_PWD" ]; then
            echo "Decoding release keystore from repository secrets..."
            echo "$KEYSTORE_SECRET" | base64 --decode > "${{ github.workspace }}/keystore/release.jks"
            echo "KEYSTORE_PATH=${{ github.workspace }}/keystore/release.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PWD" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PWD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS_NAME" >> $GITHUB_ENV
            echo "HAS_RELEASE_SIGNING=true" >> $GITHUB_ENV
            echo "Release keystore configured successfully."
          else
            echo "Release keystore secrets not fully configured (KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD)."
            echo "HAS_RELEASE_SIGNING=false" >> $GITHUB_ENV
            echo "Will generate unsigned release APK or debug-signed APK."
          fi

      # ====================================================================
      # 4. BUILD & PACKAGE APK
      # ====================================================================
      - name: Build Android Package
        run: |
          BUILD_TASK="${{ inputs.build_type || 'assembleRelease' }}"
          echo "Building Aether AI with task: $BUILD_TASK"

          if [ "$HAS_RELEASE_SIGNING" = "true" ]; then
            echo "Building with release signing credentials..."
            ./gradlew "$BUILD_TASK" --no-daemon --stacktrace || gradle "$BUILD_TASK" --no-daemon --stacktrace
          else
            echo "Building release APK (unsigned/fallback) or debug APK..."
            ./gradlew "$BUILD_TASK" --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon
          fi

      # ====================================================================
      # 5. VERIFY APK EXISTENCE, METADATA & CALCULATE CHECKSUMS
      # ====================================================================
      - name: Verify APK, Metadata & Compute Checksums
        id: package_artifacts
        run: |
          mkdir -p dist_artifacts

          # Find all generated APKs and AABs
          echo "Searching for generated build outputs..."
          find app/build/outputs/ -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} dist_artifacts/ \;

          cd dist_artifacts
          echo "Collected artifacts:"
          ls -lh

          PRIMARY_APK=$(find . -name "*.apk" | head -n 1)
          if [ -z "$PRIMARY_APK" ]; then
            echo "ERROR: No APK was generated!"
            exit 1
          fi

          echo "Primary APK detected: $PRIMARY_APK"

          # Verify APK with aapt2 if available
          if command -v aapt2 &> /dev/null; then
            echo "Verifying APK package metadata via aapt2..."
            aapt2 dump badging "$PRIMARY_APK" | grep -E "package: name=|versionCode=|versionName=" || true
          fi

          # Calculate SHA-256 and MD5 for every artifact
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" > "${file}.sha256"
              md5sum "$file" > "${file}.md5"
              echo "Checksum for $file:"
              cat "${file}.sha256"
            fi
          done

          # Create a consolidated CHECKSUMS.txt manifest
          sha256sum *.{apk,aab} 2>/dev/null > CHECKSUMS_SHA256.txt || true
          cd ..

      # ====================================================================
      # 6. ARTIFACT UPLOADS
      # ====================================================================
      - name: Upload Build Artifacts & Checksums
        uses: actions/upload-artifact@v4
        with:
          name: aether-ai-build-artifacts
          path: |
            dist_artifacts/*.apk
            dist_artifacts/*.aab
            dist_artifacts/*.sha256
            dist_artifacts/*.md5
            dist_artifacts/CHECKSUMS_SHA256.txt
          retention-days: 30
          if-no-files-found: error

      # ====================================================================
      # 7. AUTOMATED GITHUB RELEASE (TAGGED BUILDS ONLY)
      # ====================================================================
      - name: Publish Automated GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Aether AI ${{ github.ref_name }} — Production Release"
          body_path: RELEASE_V1.0.0.md
          files: |
            dist_artifacts/*.apk
            dist_artifacts/*.aab
            dist_artifacts/*.sha256
            dist_artifacts/*.md5
            dist_artifacts/CHECKSUMS_SHA256.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
